[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ufanet-async"
version = "0.1.0"
description = "Async Python clients for Ufanet Ucams and Smart Home services"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ufanet Async contributors" }]
dependencies = [
  "aiohttp>=3.12,<4",
  "lxml>=6.1,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "pytest-cov>=7,<8"]
dev = ["ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ufanet_async"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ufanet_async"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true
